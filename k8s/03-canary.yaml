apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-stable
  namespace: aceest-gym
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aceest-canary
      track: stable
  template:
    metadata:
      labels:
        app: aceest-canary
        track: stable
        version: v2.0.0
    spec:
      containers:
      - name: aceest-fitness
        image: 9597654915/aceest-fitness:v2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-release
  namespace: aceest-gym
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary
      track: canary
  template:
    metadata:
      labels:
        app: aceest-canary
        track: canary
        version: v3.0.0
    spec:
      containers:
      - name: aceest-fitness
        image: 9597654915/aceest-fitness:v3.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-svc
  namespace: aceest-gym
spec:
  type: NodePort
  selector:
    app: aceest-canary
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30083

apiVersion: v1
kind: ConfigMap
metadata:
  name: shadow-proxy-config
  namespace: aceest-gym
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      upstream prod_backend { server aceest-shadow-prod-svc:5000; }
      upstream shadow_backend { server aceest-shadow-mirror-svc:5000; }
      server {
        listen 8080;
        location / {
          mirror /mirror;
          mirror_request_body on;
          proxy_pass http://prod_backend;
        }
        location = /mirror {
          internal;
          proxy_pass http://shadow_backend$request_uri;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-prod
  namespace: aceest-gym
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow
      role: prod
  template:
    metadata:
      labels:
        app: aceest-shadow
        role: prod
    spec:
      containers:
      - name: aceest-fitness
        image: sspirate11/aceest-fitness:v2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-mirror
  namespace: aceest-gym
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow
      role: shadow
  template:
    metadata:
      labels:
        app: aceest-shadow
        role: shadow
    spec:
      containers:
      - name: aceest-fitness
        image: sspirate11/aceest-fitness:v3.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-prod-svc
  namespace: aceest-gym
spec:
  selector:
    app: aceest-shadow
    role: prod
  ports:
  - port: 5000
    targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-mirror-svc
  namespace: aceest-gym
spec:
  selector:
    app: aceest-shadow
    role: shadow
  ports:
  - port: 5000
    targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-router
  namespace: aceest-gym
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow-router
  template:
    metadata:
      labels:
        app: aceest-shadow-router
    spec:
      containers:
      - name: nginx-mirror
        image: nginx:alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config
        configMap:
          name: shadow-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-entry-svc
  namespace: aceest-gym
spec:
  type: NodePort
  selector:
    app: aceest-shadow-router
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30084

apiVersion: v1
kind: ConfigMap
metadata:
  name: ab-router-config
  namespace: aceest-gym
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      map $http_x_test_group $ab_upstream {
        default "aceest-ab-variant-a-svc:5000";
        "B"     "aceest-ab-variant-b-svc:5000";
      }
      server {
        listen 8080;
        location / {
          add_header X-Routed-Variant $ab_upstream;
          proxy_pass http://$ab_upstream;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-ab-variant-a
  namespace: aceest-gym
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-ab
      variant: A
  template:
    metadata:
      labels:
        app: aceest-ab
        variant: A
    spec:
      containers:
      - name: aceest-fitness
        image: 9597654915/aceest-fitness:v2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-ab-variant-b
  namespace: aceest-gym
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-ab
      variant: B
  template:
    metadata:
      labels:
        app: aceest-ab
        variant: B
    spec:
      containers:
      - name: aceest-fitness
        image: 9597654915/aceest-fitness:v3.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-variant-a-svc
  namespace: aceest-gym
spec:
  selector:
    app: aceest-ab
    variant: A
  ports:
  - port: 5000
    targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-variant-b-svc
  namespace: aceest-gym
spec:
  selector:
    app: aceest-ab
    variant: B
  ports:
  - port: 5000
    targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-ab-router
  namespace: aceest-gym
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-ab-router
  template:
    metadata:
      labels:
        app: aceest-ab-router
    spec:
      containers:
      - name: nginx-ab
        image: nginx:alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config
        configMap:
          name: ab-router-config
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-entry-svc
  namespace: aceest-gym
spec:
  type: NodePort
  selector:
    app: aceest-ab-router
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30085

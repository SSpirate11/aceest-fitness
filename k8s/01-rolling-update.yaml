apiVersion: v1
kind: Namespace
metadata:
  name: aceest-gym
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
  namespace: aceest-gym
  labels:
    app: aceest-fitness
    strategy: rolling
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest-fitness
      strategy: rolling
  template:
    metadata:
      labels:
        app: aceest-fitness
        strategy: rolling
        version: v3.0.0
    spec:
      containers:
      - name: aceest-fitness
        image: 9597654915/aceest-fitness:v3.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-rolling-svc
  namespace: aceest-gym
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    strategy: rolling
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30081

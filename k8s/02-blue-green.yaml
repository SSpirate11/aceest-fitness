apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest-gym
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bg
      slot: blue
  template:
    metadata:
      labels:
        app: aceest-bg
        slot: blue
        version: v2.0.0
    spec:
      containers:
      - name: aceest-fitness
        image: 9597654915/aceest-fitness:v2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  namespace: aceest-gym
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bg
      slot: green
  template:
    metadata:
      labels:
        app: aceest-bg
        slot: green
        version: v3.0.0
    spec:
      containers:
      - name: aceest-fitness
        image: 9597654915/aceest-fitness:v3.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bg-svc
  namespace: aceest-gym
spec:
  type: NodePort
  selector:
    app: aceest-bg
    slot: blue
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30082

name: ACEest CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: aceest-fitness

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check (syntax errors)
        run: python -m compileall -q app.py aceest tests

      - name: Lint with flake8
        run: flake8 .

  docker-build:
    name: Docker Image Assembly
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t $IMAGE_NAME:test .

      - name: Build runtime image
        run: docker build --target runtime -t $IMAGE_NAME:${{ github.sha }} .

      - name: Show image sizes
        run: docker images $IMAGE_NAME

      - name: Save images
        run: docker save $IMAGE_NAME:test $IMAGE_NAME:${{ github.sha }} | gzip > images.tar.gz

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: images.tar.gz
          retention-days: 1

  test:
    name: Automated Testing (in container)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Download images artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load images
        run: gunzip -c images.tar.gz | docker load

      - name: Run Pytest inside the container
        run: |
          set +e
          docker run --name aceest-tests $IMAGE_NAME:test
          status=$?
          docker cp aceest-tests:/tmp/reports ./reports
          exit $status

      - name: Smoke test runtime container
        run: |
          docker run -d --name aceest-app -p 5000:5000 $IMAGE_NAME:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fs http://localhost:5000/health && exit 0
            sleep 2
          done
          docker logs aceest-app
          exit 1

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/
